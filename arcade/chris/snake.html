<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Worm Eats Eggs</title>
    <style>
        body {
            background: #222;
            color: #fff;
            text-align: center;
        }

        canvas {
            background: #333;
            display: block;
            margin: 20px auto;
            border: 2px solid #fff;
        }
    </style>
</head>

<body>
    <h1>Worm Eats Eggs</h1>
    <canvas id="game" width="400" height="400"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        let worm = [{ x: 200, y: 200 }];
        let direction = { x: gridSize, y: 0 };
        let egg = spawnEgg();
        let growing = false;
        let gameOver = false;

        function spawnEgg() {
            return {
                x: Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize,
                y: Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize
            };
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw egg
            ctx.fillStyle = "#ffe066";
            ctx.beginPath();
            ctx.arc(egg.x + gridSize / 2, egg.y + gridSize / 2, gridSize / 4, 0, Math.PI * 2);
            ctx.fill();

            // Draw worm
            ctx.fillStyle = "#a3e635";
            worm.forEach((segment, i) => {
                ctx.beginPath();
                ctx.arc(segment.x + gridSize / 2, segment.y + gridSize / 2, gridSize / 2.5, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function update() {
            if (gameOver) return;

            const head = { x: worm[0].x + direction.x, y: worm[0].y + direction.y };

            // Wall collision
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                gameOver = true;
                alert("Game Over! Refresh to play again.");
                return;
            }

            // Self collision
            if (worm.some(seg => seg.x === head.x && seg.y === head.y)) {
                gameOver = true;
                alert("Game Over! Refresh to play again.");
                return;
            }

            worm.unshift(head);

            // Egg eaten
            if (head.x === egg.x && head.y === egg.y) {
                egg = spawnEgg();
                growing = true;
            }

            if (!growing) {
                worm.pop();
            } else {
                growing = false;
            }
        }

        document.addEventListener('keydown', e => {
            if (e.key === "ArrowUp" && direction.y === 0) direction = { x: 0, y: -gridSize };
            else if (e.key === "ArrowDown" && direction.y === 0) direction = { x: 0, y: gridSize };
            else if (e.key === "ArrowLeft" && direction.x === 0) direction = { x: -gridSize, y: 0 };
            else if (e.key === "ArrowRight" && direction.x === 0) direction = { x: gridSize, y: 0 };
        });

        function gameLoop() {
            update();
            draw();
            if (!gameOver) setTimeout(gameLoop, 200); // Slower speed (was 100)
        }

        gameLoop();
    </script>
</body>

</html>
