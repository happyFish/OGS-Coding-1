<!DOCTYPE html>
<html lang="en">
<head>

        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            cursor: none;
        }
        
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        
        #ui {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #ff4444;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            z-index: 100;
            font-weight: bold;
        }
        
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff0000;
            pointer-events: none;
            z-index: 100;
        }
        
        #instructions {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #888;
            font-size: 12px;
            text-align: right;
            z-index: 100;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        
        #gameOver {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0000;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            z-index: 100;
            display: none;
            text-align: center;
        }
        
        #vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, transparent 0%, transparent 40%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 50;
        }
        
        #levelMenu {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ff4444;
            border-radius: 10px;
            padding: 30px;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            text-align: center;
            z-index: 200;
            display: none;
            min-width: 400px;
        }
        
        #levelMenu h2 {
            color: #ff4444;
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        .level-button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 15px;
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .level-button:hover {
            background: rgba(255, 68, 68, 0.4);
        }
        
        .level-button.completed {
            background: rgba(0, 255, 0, 0.2);
            border-color: #00ff00;
        }
        
        .level-button.completed:hover {
            background: rgba(0, 255, 0, 0.4);
        }
    </style>
</head>

        // Initialize audio

            try {

            } catch (e) {
                console.log('Audio not supported');
            }
        }
        
        // Play sound effect
        function playSound(frequency, duration, type = 'sine', volume = 0.1) {
            if (!audioCtx) return;
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.frequency.value = frequency;
            oscillator.type = type;
            
            gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + duration);
        }
        
        // Enemy class
        class Enemy {
            constructor(x, y, config) {
                this.x = x;
                this.y = y;
                this.angle = Math.random() * Math.PI * 2;
                this.health = config.enemyHealth;
                this.maxHealth = config.enemyHealth;
                this.speed = config.enemySpeed;
                this.attackCooldown = 0;
                this.size = 0.3;
                this.aggroRange = 5;
                this.attackRange = 1;
                this.lastSeen = 0;
                this.wanderTimer = 0;
                this.color = config.enemyColor;
                this.dead = false;
            }
            
            update() {
                if (this.dead) return;
                
                const dx = player.x - this.x;
                const dy = player.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                // Check if player is in range
                if (distance < this.aggroRange) {
                    this.lastSeen = Date.now();
                    
                    // Move towards player
                    if (distance > this.attackRange) {
                        const moveX = (dx / distance) * this.speed;
                        const moveY = (dy / distance) * this.speed;
                        
                        // Check collision before moving
                        if (!this.checkWallCollision(this.x + moveX, this.y)) {
                            this.x += moveX;
                        }
                        if (!this.checkWallCollision(this.x, this.y + moveY)) {
                            this.y += moveY;
                        }
                    }
                    
                    // Attack player
                    if (distance < this.attackRange && this.attackCooldown <= 0) {
                        this.attackPlayer();
                        this.attackCooldown = 120; // 2 seconds at 60 FPS
                    }
                } else if (Date.now() - this.lastSeen > 2000) {
                    // Wander randomly
                    this.wanderTimer++;
                    if (this.wanderTimer > 60) {
                        this.angle += (Math.random() - 0.5) * 0.5;
                        this.wanderTimer = 0;
                    }
                    
                    const moveX = Math.cos(this.angle) * this.speed * 0.5;
                    const moveY = Math.sin(this.angle) * this.speed * 0.5;
                    
                    if (!this.checkWallCollision(this.x + moveX, this.y + moveY)) {
                        this.x += moveX;
                        this.y += moveY;
                    } else {
                        this.angle += Math.PI / 2;
                    }
                }
                
                if (this.attackCooldown > 0) {
                    this.attackCooldown--;
                }
            }
            
            checkWallCollision(x, y) {
                // Add collision radius for enemies too
                const radius = 0.15;
                
                // Check corners of enemy's collision box
                const corners = [
                    { x: x - radius, y: y - radius },
                    { x: x + radius, y: y - radius },
                    { x: x - radius, y: y + radius },
                    { x: x + radius, y: y + radius }
                ];
                
                for (let corner of corners) {
                    const mapX = Math.floor(corner.x);
                    const mapY = Math.floor(corner.y);
                    
                    if (mapX < 0 || mapX >= WORLD_WIDTH || mapY < 0 || mapY >= WORLD_HEIGHT) {
                        return true;
                    }
                    
                    if (worldMap[mapY][mapX] === 1) {
                        return true;
                    }
                }
                
                return false;
            }
            
            attackPlayer() {
                player.health -= 20;
                player.damageFlash = 30; // Flash for 30 frames (half second at 60fps)
                playSound(100, 0.3, 'sawtooth', 0.15);
                
                if (player.health <= 0) {
                    gameOver();
                }
            }
            
            takeDamage(damage) {
                this.health -= damage;
                playSound(300, 0.2, 'square', 0.1);
                
                if (this.health <= 0) {
                    this.dead = true;
                    player.score += 100;
                    playSound(150, 0.5, 'triangle', 0.2);
                }
            }
            
            getDistance() {
                const dx = player.x - this.x;
                const dy = player.y - this.y;
                return Math.sqrt(dx * dx + dy * dy);
            }
            
            getAngle() {
                return Math.atan2(this.y - player.y, this.x - player.x);
            }
        }
        
        // Bullet class
        class Bullet {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                this.dx = Math.cos(angle) * 0.2;
                this.dy = Math.sin(angle) * 0.2;
                this.life = 100;
                this.size = 0.1;
            }
            
            update() {
                this.x += this.dx;
                this.y += this.dy;
                this.life--;
                
                // Check wall collision
                const mapX = Math.floor(this.x);
                const mapY = Math.floor(this.y);
                
                if (mapX < 0 || mapX >= WORLD_WIDTH || mapY < 0 || mapY >= WORLD_HEIGHT || 
                    worldMap[mapY][mapX] === 1) {
                    this.life = 0;
                    return;
                }
                
                // Check enemy collision
                for (let enemy of enemies) {
                    if (enemy.dead) continue;
                    
                    const dx = this.x - enemy.x;
                    const dy = this.y - enemy.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < enemy.size) {
                        enemy.takeDamage(25);
                        this.life = 0;
                        break;
                    }
                }
            }
        }
        
        // Initialize enemies
        function spawnEnemies() {
            enemies = [];
            const config = currentLevelConfig;
            
            for (let i = 0; i < config.enemyCount; i++) {
                let x, y;
                let attempts = 0;
                
                do {
                    x = Math.random() * (WORLD_WIDTH - 2) + 1;
                    y = Math.random() * (WORLD_HEIGHT - 2) + 1;
                    attempts++;
                } while ((worldMap[Math.floor(y)][Math.floor(x)] === 1 || 
                         (Math.abs(x - player.x) < 2 && Math.abs(y - player.y) < 2)) && 
                         attempts < 100);
                
                if (attempts < 100) {
                    enemies.push(new Enemy(x, y, config));
                }
            }
        }
        
        // Raycasting function
        function castRay(angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            
            let x = player.x;
            let y = player.y;
            
            // Use smaller steps for more accurate collision detection
            for (let depth = 0; depth < MAX_DEPTH; depth += 0.01) {
                const targetX = x + cos * depth;
                const targetY = y + sin * depth;
                
                const mapX = Math.floor(targetX);
                const mapY = Math.floor(targetY);
                
                if (mapX < 0 || mapX >= WORLD_WIDTH || mapY < 0 || mapY >= WORLD_HEIGHT) {
                    return { distance: depth, hitWall: true, wallType: 1 };
                }
                
                if (worldMap[mapY][mapX] === 1) {
                    return { distance: depth, hitWall: true, wallType: worldMap[mapY][mapX] };
                }
            }
            
            return { distance: MAX_DEPTH, hitWall: false, wallType: 0 };
        }
        
        // 3D rendering
        function render3D() {
            // Clear screen
            ctx.fillStyle = currentLevelConfig.fogColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw ceiling and floor
            const horizon = canvas.height / 2 + player.bobOffset;
            
            // Ceiling
            ctx.fillStyle = currentLevelConfig.ceilingColor;
            ctx.fillRect(0, 0, canvas.width, horizon);
            
            // Floor
            ctx.fillStyle = currentLevelConfig.floorColor;
            ctx.fillRect(0, horizon, canvas.width, canvas.height - horizon);
            
            // Cast rays for walls
            for (let ray = 0; ray < NUM_RAYS; ray++) {
                const rayAngle = player.angle - HALF_FOV + (ray * DELTA_ANGLE);
                const rayResult = castRay(rayAngle);
                
                // Calculate wall height
                const distance = rayResult.distance * Math.cos(rayAngle - player.angle); // Fix fisheye
                const wallHeight = canvas.height / distance;
                
                // Calculate wall position
                const wallTop = horizon - wallHeight / 2;
                const wallBottom = horizon + wallHeight / 2;
                
                if (rayResult.hitWall) {
                    // Wall shading based on distance
                    const shade = Math.max(0, 1 - distance / MAX_DEPTH);
                    const brightness = Math.floor(shade * 255);
                    
                    // Use level-specific wall colors
                    const r = Math.floor(brightness * currentLevelConfig.wallColor.r);
                    const g = Math.floor(brightness * currentLevelConfig.wallColor.g);
                    const b = Math.floor(brightness * currentLevelConfig.wallColor.b);
                    const color = `rgb(${r}, ${g}, ${b})`;
                    
                    ctx.fillStyle = color;
                    ctx.fillRect(ray, wallTop, 1, wallHeight);
                }
            }
            
            // Render enemies (sprites)
            const sortedEnemies = enemies
                .filter(enemy => !enemy.dead)
                .map(enemy => ({ enemy, distance: enemy.getDistance() }))
                .sort((a, b) => b.distance - a.distance); // Back to front
            
            for (let { enemy, distance } of sortedEnemies) {
                if (distance > MAX_DEPTH) continue;
                
                // Check if enemy is blocked by walls (line of sight)
                const dx = enemy.x - player.x;
                const dy = enemy.y - player.y;
                const angleToEnemy = Math.atan2(dy, dx);
                
                // Cast a ray to the enemy to check for wall occlusion
                let blocked = false;
                const stepSize = 0.1;
                for (let step = 0; step < distance; step += stepSize) {
                    const checkX = player.x + Math.cos(angleToEnemy) * step;
                    const checkY = player.y + Math.sin(angleToEnemy) * step;
                    
                    const mapX = Math.floor(checkX);
                    const mapY = Math.floor(checkY);
                    
                    if (mapX < 0 || mapX >= WORLD_WIDTH || mapY < 0 || mapY >= WORLD_HEIGHT || 
                        worldMap[mapY][mapX] === 1) {
                        blocked = true;
                        break;
                    }
                }
                
                if (blocked) continue; // Don't render if blocked by wall
                
                // Calculate enemy screen position
                const enemyAngle = enemy.getAngle();
                const angleDiff = enemyAngle - player.angle;
                
                // Normalize angle difference
                let normalizedAngle = angleDiff;
                while (normalizedAngle > Math.PI) normalizedAngle -= 2 * Math.PI;
                while (normalizedAngle < -Math.PI) normalizedAngle += 2 * Math.PI;
                
                if (Math.abs(normalizedAngle) > HALF_FOV) continue; // Enemy not in view
                
                const enemyScreenX = (normalizedAngle + HALF_FOV) / FOV * canvas.width;
                const enemyHeight = canvas.height / distance * 0.5;
                const enemyWidth = enemyHeight;
                
                const enemyTop = horizon - enemyHeight / 2;
                
                // Enemy shading
                const shade = Math.max(0, 1 - distance / MAX_DEPTH);
                const brightness = Math.floor(shade * 255);
                
                // Parse enemy color and apply shading
                const colorMatch = enemy.color.match(/^#([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i);
                if (colorMatch) {
                    const r = Math.floor(parseInt(colorMatch[1], 16) * shade);
                    const g = Math.floor(parseInt(colorMatch[2], 16) * shade);
                    const b = Math.floor(parseInt(colorMatch[3], 16) * shade);
                    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                } else {
                    ctx.fillStyle = `rgb(${brightness}, 0, 0)`;
                }
                ctx.fillRect(
                    enemyScreenX - enemyWidth / 2,
                    enemyTop,
                    enemyWidth,
                    enemyHeight
                );
                
                // Draw enemy eyes
                if (distance < 5) {
                    ctx.fillStyle = `rgb(${Math.floor(brightness * 1.5)}, ${Math.floor(brightness * 1.5)}, 0)`;
                    const eyeSize = enemyWidth * 0.1;
                    ctx.fillRect(enemyScreenX - enemyWidth * 0.2, enemyTop + enemyHeight * 0.2, eyeSize, eyeSize);
                    ctx.fillRect(enemyScreenX + enemyWidth * 0.1, enemyTop + enemyHeight * 0.2, eyeSize, eyeSize);
                }
            }
            
            // Weapon rendering (simple gun sprite)
            const gunWidth = canvas.width * 0.3;
            const gunHeight = canvas.height * 0.4;
            const gunX = canvas.width - gunWidth;
            const gunY = canvas.height - gunHeight + player.bobOffset * 2;
            
            // Gun body
            ctx.fillStyle = '#444444';
            ctx.fillRect(gunX, gunY, gunWidth, gunHeight);
            
            // Gun barrel
            ctx.fillStyle = '#222222';
            ctx.fillRect(gunX, gunY, gunWidth * 0.8, gunHeight * 0.2);
            
            // Muzzle flash effect
            if (player.shootCooldown > 10) {
                ctx.fillStyle = '#ffff88';
                ctx.fillRect(gunX - 20, gunY - 10, 30, 40);
                ctx.fillStyle = '#ff8800';
                ctx.fillRect(gunX - 15, gunY - 5, 20, 30);
            }
            
            // Damage flash effect
            if (player.damageFlash > 0) {
                const flashIntensity = player.damageFlash / 30; // Fade from 1 to 0
                ctx.fillStyle = `rgba(255, 0, 0, ${flashIntensity * 0.4})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            // Level transition effect
            if (levelTransition) {
                const alpha = Math.sin(transitionTimer / 30) * 0.5 + 0.5;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.8})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Level name display
                ctx.fillStyle = '#ffffff';
                ctx.font = '48px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(currentLevelConfig.name, canvas.width / 2, canvas.height / 2 - 50);
                ctx.font = '24px Courier New';
                ctx.fillText(`Level ${currentLevel}`, canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = 'left';
            }
        }
        
        // Event listeners
        canvas.addEventListener('click', () => {
            if (!gameRunning) return;
            
            if (!audioCtx) {
                initAudio();
                canvas.requestPointerLock();
            }
            
            shoot();
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (!gameRunning) return;
            
            const sensitivity = 0.003;
            const movementX = e.movementX || e.mozMovementX || e.webkitMovementX || 0;
            
            player.angle += movementX * sensitivity;
            
            // Normalize angle
            while (player.angle > 2 * Math.PI) player.angle -= 2 * Math.PI;
            while (player.angle < 0) player.angle += 2 * Math.PI;
        });
        
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            
            if (e.code === 'KeyR') {
                reload();
            }
            
            // ESC key to open level menu
            if (e.code === 'Escape' && gameRunning) {
                showLevelMenu();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });
        
        // Player movement
        function updatePlayer() {
            if (!gameRunning) return;
            
            let moveX = 0;
            let moveY = 0;
            const isSprinting = keys['ShiftLeft'] || keys['ShiftRight'];
            const currentSpeed = isSprinting ? player.sprintSpeed : player.speed;
            
            if (keys['KeyW'] || keys['ArrowUp']) {
                moveX += Math.cos(player.angle) * currentSpeed;
                moveY += Math.sin(player.angle) * currentSpeed;
            }
            if (keys['KeyS'] || keys['ArrowDown']) {
                moveX -= Math.cos(player.angle) * currentSpeed;
                moveY -= Math.sin(player.angle) * currentSpeed;
            }
            if (keys['KeyA'] || keys['ArrowLeft']) {
                moveX += Math.cos(player.angle - Math.PI / 2) * currentSpeed;
                moveY += Math.sin(player.angle - Math.PI / 2) * currentSpeed;
            }
            if (keys['KeyD'] || keys['ArrowRight']) {
                moveX += Math.cos(player.angle + Math.PI / 2) * currentSpeed;
                moveY += Math.sin(player.angle + Math.PI / 2) * currentSpeed;
            }
            
            // Check collision and move
            const nextX = player.x + moveX;
            const nextY = player.y + moveY;
            
            // Check X movement separately
            if (!checkWallCollision(nextX, player.y)) {
                player.x = nextX;
            }
            
            // Check Y movement separately
            if (!checkWallCollision(player.x, nextY)) {
                player.y = nextY;
            }
            
            // Head bobbing
            if (moveX !== 0 || moveY !== 0) {
                player.bobSpeed += 0.3;
                player.bobOffset = Math.sin(player.bobSpeed) * 5;
            } else {
                player.bobSpeed *= 0.9;
                player.bobOffset *= 0.9;
            }
            
            if (player.shootCooldown > 0) {
                player.shootCooldown--;
            }
            
            if (player.damageFlash > 0) {
                player.damageFlash--;
            }
        }
        
        function checkWallCollision(x, y) {
            // Add collision radius to prevent clipping into walls
            const radius = 0.2;
            
            // Check corners of player's collision box
            const corners = [
                { x: x - radius, y: y - radius },
                { x: x + radius, y: y - radius },
                { x: x - radius, y: y + radius },
                { x: x + radius, y: y + radius }
            ];
            
            for (let corner of corners) {
                const mapX = Math.floor(corner.x);
                const mapY = Math.floor(corner.y);
                
                if (mapX < 0 || mapX >= WORLD_WIDTH || mapY < 0 || mapY >= WORLD_HEIGHT) {
                    return true;
                }
                
                if (worldMap[mapY][mapX] === 1) {
                    return true;
                }
            }
            
            return false;
        }
        
        // Shooting
        function shoot() {
            if (player.ammo <= 0 || player.shootCooldown > 0) return;
            
            player.ammo--;
            player.shootCooldown = 20; // Third of a second cooldown
            
            bullets.push(new Bullet(player.x, player.y, player.angle));
            playSound(800, 0.1, 'square', 0.2);
        }
        
        // Reload
        function reload() {
            if (player.totalAmmo <= 0 || player.ammo >= 30) return;
            
            const needed = 30 - player.ammo;
            const available = Math.min(needed, player.totalAmmo);
            
            player.ammo += available;
            player.totalAmmo -= available;
            
            playSound(400, 0.5, 'triangle', 0.1);
        }
        
        // Update UI
        function updateUI() {
            document.getElementById('health').textContent = Math.max(0, player.health);
            document.getElementById('ammo').textContent = player.ammo;
            document.getElementById('score').textContent = player.score;
            document.getElementById('enemyCount').textContent = enemies.filter(e => !e.dead).length;
            document.getElementById('level').textContent = currentLevel;
            document.getElementById('levelName').textContent = currentLevelConfig.name;
            
            // Health color
            const healthElement = document.getElementById('health');
            if (player.health > 60) {
                healthElement.style.color = '#00ff00';
            } else if (player.health > 30) {
                healthElement.style.color = '#ffff00';
            } else {
                healthElement.style.color = '#ff0000';
            }
        }
        
        // Load level
        function loadLevel(levelIndex) {
            if (levelIndex >= worldMaps.length) {
                // Game completed!
                document.getElementById('gameOverText').textContent = 'ALL LEVELS COMPLETED!';
                document.getElementById('gameOverText').style.color = '#00ff00';
                document.getElementById('gameOver').style.display = 'block';
                gameRunning = false;
                playSound(1200, 3, 'sine', 0.4);
                return;
            }
            
            currentLevel = levelIndex + 1;
            worldMap = worldMaps[levelIndex];
            currentLevelConfig = levelConfigs[levelIndex];
            
            // Reset player position
            player.x = 1.5;
            player.y = 1.5;
            player.angle = 0;
            player.health = Math.min(100, player.health + 25); // Heal a bit between levels
            player.ammo = Math.min(30, player.ammo + 10); // Give some ammo
            
            // Clear existing entities
            bullets = [];
            
            // Spawn new enemies
            spawnEnemies();
            
            // Start level transition effect
            levelTransition = true;
            transitionTimer = 0;
            
            setTimeout(() => {
                levelTransition = false;
            }, 3000);
            
            playSound(800, 1, 'sine', 0.3);
        }
        
        // Level selection functions
        function showLevelMenu() {
            gameRunning = false;
            document.getElementById('levelMenu').style.display = 'block';
            updateLevelMenuButtons();
        }
        
        function hideLevelMenu() {
            document.getElementById('levelMenu').style.display = 'none';
            gameRunning = true;
        }
        
        function selectLevel(levelIndex) {
            hideLevelMenu();
            loadLevel(levelIndex);
        }
        
        function updateLevelMenuButtons() {
            const buttons = document.querySelectorAll('.level-button');
            buttons.forEach((button, index) => {
                if (completedLevels.includes(index)) {
                    button.classList.add('completed');
                } else {
                    button.classList.remove('completed');
                }
            });
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            document.getElementById('gameOver').style.display = 'block';
            playSound(100, 2, 'sawtooth', 0.3);
        }
        
        // Check win condition
        function checkWin() {
            const aliveEnemies = enemies.filter(e => !e.dead).length;
            if (aliveEnemies === 0 && !levelTransition) {
                // Mark current level as completed
                const currentLevelIndex = currentLevel - 1;
                if (!completedLevels.includes(currentLevelIndex)) {
                    completedLevels.push(currentLevelIndex);
                }
                
                if (currentLevel >= maxLevel) {
                    // All levels completed
                    document.getElementById('gameOverText').textContent = 'ALL LEVELS COMPLETED!';
                    document.getElementById('gameOverText').style.color = '#00ff00';
                    document.getElementById('gameOver').style.display = 'block';
                    gameRunning = false;
                    playSound(1200, 3, 'sine', 0.4);
                } else {
                    // Show level selection menu
                    setTimeout(() => {
                        document.getElementById('levelCompleteText').textContent = `${currentLevelConfig.name} completed!`;
                        showLevelMenu();
                        playSound(1000, 1, 'sine', 0.3);
                    }, 1000);
                }
            }
        }
        
        // Game loop
        function gameLoop() {
            updatePlayer();
            
            if (gameRunning) {
                // Update level transition
                if (levelTransition) {
                    transitionTimer++;
                }
                
                // Update enemies
                for (let enemy of enemies) {
                    enemy.update();
                }
                
                // Update bullets
                for (let i = bullets.length - 1; i >= 0; i--) {
                    bullets[i].update();
                    if (bullets[i].life <= 0) {
                        bullets.splice(i, 1);
                    }
                }
                
                checkWin();
            }
            
            render3D();
            updateUI();
            requestAnimationFrame(gameLoop);
        }
        
        // Initialize game
        loadLevel(0); // Start with level 1 (index 0)
        gameLoop();
        
        // Request pointer lock on click
        canvas.addEventListener('click', () => {
            canvas.requestPointerLock();
        });
    </script>
</body>
</html>
