<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦀 Pixel Crab Adventure - Under the Sea</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #001133 0%, #003366 50%, #004080 100%);
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }

        h1 {
            color: #00FFFF;
            text-shadow: 2px 2px 0px #000080;
            margin: 5px 0;
            font-size: 14px;
            text-align: center;
            position: absolute;
            top: 10px;
            z-index: 10;
        }

        #gameCanvas {
            border: none;
            width: 100vw;
            height: 100vh;
            background: #000080;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            display: block;
        }

        #gameInfo {
            color: #00FFFF;
            font-size: 10px;
            text-align: center;
            text-shadow: 1px 1px 0px #000080;
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
        }

        #controls {
            color: #AAFFFF;
            text-align: center;
            font-size: 8px;
            opacity: 0.9;
            max-width: 600px;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
        }

        .score {
            color: #FFD700;
        }

        .health {
            color: #FF6B6B;
        }
    </style>
</head>

<body>
    <h1>🦀 PIXEL CRAB ADVENTURE 🦀<br>UNDER THE SEA</h1>
    <canvas id="gameCanvas"></canvas>
    <div id="gameInfo">
        <div>PEARLS: <span id="score" class="score">0</span> | HEALTH: <span id="health" class="health">3</span></div>
        <div id="gameStatus">Collect pearls and avoid the jellyfish!</div>
    </div>
    <div id="controls">
        ARROW KEYS or WASD to move • Collect pearls • Avoid jellyfish • Find the treasure chest!
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const healthElement = document.getElementById('health');
        const statusElement = document.getElementById('gameStatus');

        // Disable image smoothing for pixel art
        ctx.imageSmoothingEnabled = false;

        // Set canvas to fullscreen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.imageSmoothingEnabled = false;
        }

        // Call resize on load and window resize
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            regenerateElements();
        });

        // Game state
        const game = {
            score: 0,
            health: 3,
            gameRunning: true,
            time: 0
        };

        // Player (Crab)
        const player = {
            x: 100,
            y: 200,
            width: 32,
            height: 24,
            velocityX: 0,
            velocityY: 0,
            speed: 4,
            color: '#FF6B47',
            invulnerable: 0
        };

        // Function to get responsive positions
        function getResponsiveX(ratio) {
            return canvas.width * ratio;
        }

        function getResponsiveY(ratio) {
            return canvas.height * ratio;
        }

        // Function to generate responsive pearls
        function generatePearls() {
            return [
                { x: getResponsiveX(0.2), y: getResponsiveY(0.15), collected: false },
                { x: getResponsiveX(0.4), y: getResponsiveY(0.1), collected: false },
                { x: getResponsiveX(0.6), y: getResponsiveY(0.25), collected: false },
                { x: getResponsiveX(0.8), y: getResponsiveY(0.2), collected: false },
                { x: getResponsiveX(0.5), y: getResponsiveY(0.7), collected: false },
                { x: getResponsiveX(0.15), y: getResponsiveY(0.8), collected: false },
                { x: getResponsiveX(0.75), y: getResponsiveY(0.6), collected: false },
                { x: getResponsiveX(0.9), y: getResponsiveY(0.4), collected: false }
            ];
        }

        // Function to generate responsive jellyfish
        function generateJellyfish() {
            return [
                { x: getResponsiveX(0.3), y: getResponsiveY(0.3), velocityX: 2, velocityY: 1, phase: 0 },
                { x: getResponsiveX(0.6), y: getResponsiveY(0.5), velocityX: -2, velocityY: -1, phase: Math.PI },
                { x: getResponsiveX(0.8), y: getResponsiveY(0.7), velocityX: 1.5, velocityY: 1.5, phase: Math.PI / 2 },
                { x: getResponsiveX(0.4), y: getResponsiveY(0.15), velocityX: -1, velocityY: 1, phase: Math.PI * 1.5 }
            ];
        }

        // Function to generate responsive seaweed
        function generateSeaweed() {
            return [
                { x: getResponsiveX(0.1), y: getResponsiveY(0.6), height: canvas.height * 0.3, sway: 0 },
                { x: getResponsiveX(0.3), y: getResponsiveY(0.5), height: canvas.height * 0.4, sway: Math.PI },
                { x: getResponsiveX(0.55), y: getResponsiveY(0.7), height: canvas.height * 0.25, sway: Math.PI / 2 },
                { x: getResponsiveX(0.85), y: getResponsiveY(0.55), height: canvas.height * 0.35, sway: Math.PI * 1.5 }
            ];
        }

        // Initialize responsive arrays
        let pearls = generatePearls();
        let jellyfish = generateJellyfish();
        let seaweed = generateSeaweed();

        // Treasure chest
        const treasure = {
            get x() { return getResponsiveX(0.9); },
            get y() { return getResponsiveY(0.85); },
            width: 40,
            height: 30,
            found: false
        };

        // Input handling
        const keys = {};

        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Collision detection
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y;
        }

        // Update player
        function updatePlayer() {
            player.velocityX = 0;
            player.velocityY = 0;

            // Handle input
            if (keys['a'] || keys['arrowleft']) {
                player.velocityX = -player.speed;
            }
            if (keys['d'] || keys['arrowright']) {
                player.velocityX = player.speed;
            }
            if (keys['w'] || keys['arrowup']) {
                player.velocityY = -player.speed;
            }
            if (keys['s'] || keys['arrowdown']) {
                player.velocityY = player.speed;
            }

            // Update position
            player.x += player.velocityX;
            player.y += player.velocityY;

            // Keep player in bounds
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

            // Decrease invulnerability
            if (player.invulnerable > 0) {
                player.invulnerable--;
            }
        }

        // Update pearls
        function updatePearls() {
            for (let pearl of pearls) {
                if (!pearl.collected && checkCollision(player, {
                    x: pearl.x - 8,
                    y: pearl.y - 8,
                    width: 16,
                    height: 16
                })) {
                    pearl.collected = true;
                    game.score += 10;
                    updateUI();
                }
            }
        }

        // Update jellyfish
        function updateJellyfish() {
            for (let jelly of jellyfish) {
                // Move jellyfish
                jelly.x += jelly.velocityX;
                jelly.y += jelly.velocityY;
                jelly.phase += 0.05;

                // Bounce off walls
                if (jelly.x <= 0 || jelly.x >= canvas.width - 30) {
                    jelly.velocityX *= -1;
                }
                if (jelly.y <= 0 || jelly.y >= canvas.height - 30) {
                    jelly.velocityY *= -1;
                }

                // Check collision with player
                if (player.invulnerable === 0 && checkCollision(player, {
                    x: jelly.x,
                    y: jelly.y,
                    width: 30,
                    height: 30
                })) {
                    game.health--;
                    player.invulnerable = 60; // 1 second at 60fps
                    updateUI();

                    if (game.health <= 0) {
                        gameOver();
                    }
                }
            }
        }

        // Function to regenerate responsive elements on resize
        function regenerateElements() {
            // Keep collected state of pearls
            const collectedStates = pearls.map(p => p.collected);
            pearls = generatePearls();
            pearls.forEach((pearl, i) => {
                pearl.collected = collectedStates[i] || false;
            });

            // Regenerate other elements
            seaweed = generateSeaweed();

            // Reset player if out of bounds
            if (player.x > canvas.width - player.width) {
                player.x = canvas.width - player.width;
            }
            if (player.y > canvas.height - player.height) {
                player.y = canvas.height - player.height;
            }
        }

        // Update treasure
        function updateTreasure() {
            if (!treasure.found && checkCollision(player, treasure)) {
                treasure.found = true;
                game.score += 100;
                statusElement.textContent = '🏆 TREASURE FOUND! You are the ultimate crab explorer! 🏆';
                statusElement.style.color = '#FFD700';
                updateUI();
            }
        }

        // Update UI
        function updateUI() {
            scoreElement.textContent = game.score;
            healthElement.textContent = game.health;

            const collectedPearls = pearls.filter(p => p.collected).length;
            if (collectedPearls === pearls.length && !treasure.found) {
                statusElement.textContent = 'All pearls collected! Find the treasure chest!';
                statusElement.style.color = '#00FF00';
            }
        }

        // Game over
        function gameOver() {
            game.gameRunning = false;
            statusElement.textContent = '💀 GAME OVER! The deep sea claimed you! 💀';
            statusElement.style.color = '#FF0000';
        }

        // Draw functions
        function drawPixelRect(x, y, width, height, color) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.floor(x), Math.floor(y), width, height);
        }

        function drawPlayer() {
            const x = Math.floor(player.x);
            const y = Math.floor(player.y);

            // Flashing effect when invulnerable
            if (player.invulnerable > 0 && Math.floor(player.invulnerable / 5) % 2) {
                return;
            }

            // Crab body
            drawPixelRect(x + 4, y + 8, 24, 12, player.color);

            // Crab shell pattern
            drawPixelRect(x + 8, y + 10, 4, 2, '#FF8C69');
            drawPixelRect(x + 16, y + 10, 4, 2, '#FF8C69');
            drawPixelRect(x + 12, y + 12, 8, 2, '#FF8C69');

            // Claws
            drawPixelRect(x, y + 12, 8, 4, player.color);
            drawPixelRect(x + 24, y + 12, 8, 4, player.color);

            // Eyes
            drawPixelRect(x + 8, y + 4, 4, 4, '#000');
            drawPixelRect(x + 20, y + 4, 4, 4, '#000');
            drawPixelRect(x + 10, y + 6, 2, 2, '#FFF');
            drawPixelRect(x + 22, y + 6, 2, 2, '#FFF');

            // Legs
            drawPixelRect(x + 6, y + 20, 2, 4, player.color);
            drawPixelRect(x + 12, y + 20, 2, 4, player.color);
            drawPixelRect(x + 18, y + 20, 2, 4, player.color);
            drawPixelRect(x + 24, y + 20, 2, 4, player.color);
        }

        function drawPearls() {
            for (let pearl of pearls) {
                if (!pearl.collected) {
                    const shimmer = Math.sin(game.time * 0.1 + pearl.x * 0.1) * 0.3 + 0.7;
                    const x = Math.floor(pearl.x);
                    const y = Math.floor(pearl.y);

                    // Pearl glow
                    ctx.fillStyle = `rgba(255, 255, 255, ${shimmer * 0.3})`;
                    ctx.fillRect(x - 2, y - 2, 12, 12);

                    // Pearl
                    drawPixelRect(x, y, 8, 8, '#F0F8FF');
                    drawPixelRect(x + 1, y + 1, 6, 6, '#E6E6FA');
                    drawPixelRect(x + 2, y + 2, 2, 2, '#FFF');
                }
            }
        }

        function drawJellyfish() {
            for (let jelly of jellyfish) {
                const x = Math.floor(jelly.x);
                const y = Math.floor(jelly.y);
                const float = Math.sin(jelly.phase) * 2;

                // Jellyfish bell
                const bellY = y + float;
                drawPixelRect(x + 6, bellY, 18, 12, 'rgba(255, 192, 203, 0.8)');
                drawPixelRect(x + 8, bellY + 2, 14, 8, 'rgba(255, 182, 193, 0.9)');
                drawPixelRect(x + 10, bellY + 4, 10, 4, 'rgba(255, 160, 160, 1.0)');

                // Tentacles
                for (let i = 0; i < 4; i++) {
                    const tentacleX = x + 8 + i * 4;
                    const tentacleFloat = Math.sin(jelly.phase + i * 0.5) * 3;
                    drawPixelRect(tentacleX, bellY + 12, 2, 8 + tentacleFloat, 'rgba(255, 192, 203, 0.7)');
                    drawPixelRect(tentacleX, bellY + 20 + tentacleFloat, 2, 4, 'rgba(255, 192, 203, 0.5)');
                }
            }
        }

        function drawSeaweed() {
            for (let weed of seaweed) {
                weed.sway += 0.02;
                const swayOffset = Math.sin(weed.sway) * 5;

                // Draw seaweed segments
                for (let i = 0; i < weed.height; i += 8) {
                    const segmentY = canvas.height - i;
                    const segmentSway = Math.sin(weed.sway + i * 0.1) * 3;
                    drawPixelRect(weed.x + swayOffset + segmentSway, segmentY - 8, 6, 8, '#228B22');
                    drawPixelRect(weed.x + swayOffset + segmentSway + 1, segmentY - 7, 4, 6, '#32CD32');
                }
            }
        }

        function drawTreasure() {
            if (!treasure.found) {
                const x = Math.floor(treasure.x);
                const y = Math.floor(treasure.y);
                const glow = Math.sin(game.time * 0.1) * 0.3 + 0.7;

                // Treasure glow
                ctx.fillStyle = `rgba(255, 215, 0, ${glow * 0.3})`;
                ctx.fillRect(x - 4, y - 4, treasure.width + 8, treasure.height + 8);

                // Chest base
                drawPixelRect(x, y + 10, treasure.width, 20, '#8B4513');
                drawPixelRect(x + 2, y + 12, treasure.width - 4, 16, '#A0522D');

                // Chest lid
                drawPixelRect(x, y, treasure.width, 15, '#DAA520');
                drawPixelRect(x + 2, y + 2, treasure.width - 4, 11, '#FFD700');

                // Lock
                drawPixelRect(x + 16, y + 8, 8, 6, '#4B0000');
                drawPixelRect(x + 18, y + 10, 4, 2, '#FFD700');
            }
        }

        function drawBackground() {
            // Water gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#000080');
            gradient.addColorStop(0.5, '#003080');
            gradient.addColorStop(1, '#004080');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Bubbles
            const bubbleCount = Math.floor(canvas.width / 40);
            for (let i = 0; i < bubbleCount; i++) {
                const bubbleX = (game.time * 0.5 + i * 40) % (canvas.width + 20);
                const bubbleY = 50 + Math.sin(game.time * 0.05 + i) * 30 + (i % 10) * (canvas.height / 10);
                const size = 2 + (i % 3);

                ctx.fillStyle = 'rgba(173, 216, 230, 0.6)';
                ctx.fillRect(Math.floor(bubbleX), Math.floor(bubbleY), size, size);
            }
        }

        // Game loop
        function gameLoop() {
            if (!game.gameRunning) return;

            game.time++;

            // Update
            updatePlayer();
            updatePearls();
            updateJellyfish();
            updateTreasure();

            // Draw
            drawBackground();
            drawSeaweed();
            drawTreasure();
            drawPearls();
            drawJellyfish();
            drawPlayer();

            requestAnimationFrame(gameLoop);
        }

        // Initialize game
        function initGame() {
            updateUI();
            gameLoop();
        }

        // Start the game
        initGame();
    </script>
</body>

</html>
