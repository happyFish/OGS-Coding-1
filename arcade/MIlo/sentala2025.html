<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>2D Two Player Fighting Game</title>
    <style>
        body {
            margin: 0;
            background: #222;
        }

        canvas {
            display: block;
            margin: 0 auto;
            background: #444;
        }

        #info {
            color: #fff;
            text-align: center;
            font-family: Arial;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div id="info">Player 1: WASD + F (attack) | Player 2: Arrow Keys + '/' (attack)</div>
    <canvas id="game" width="800" height="400"></canvas>

    <!-- Load all JavaScript files in dependency order -->
    <script src="js/config.js"></script>
    <script src="js/InputManager.js"></script>
    <script src="js/ParticleSystem.js"></script>
    <script src="js/Player.js"></script>
    <script src="js/Renderer.js"></script>
    <script src="js/CombatSystem.js"></script>
    <script src="js/Game.js"></script>

    <!-- Start the game -->
    <script>
        const canvas = document.getElementById('game');
        const game = new Game(canvas);
        game.start();
    </script>
</body>

</html>
