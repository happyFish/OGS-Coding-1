<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>2D Two Player Fighting Game</title>
    <style>
        body {
            margin: 0;
            background: #222;
        }

        canvas {
            display: block;
            margin: 0 auto;
            background: #444;
        }

        #info {
            color: #fff;
            text-align: center;
            font-family: Arial;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div id="info">Player 1: WASD + F (attack) | Player 2: Arrow Keys + '/' (attack)</div>
    <canvas id="game" width="800" height="400"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        // Draw the background from URL
        const background = new Image();
        background.src = 'https://www.creativeuncut.com/gallery-18/art/mk9-background-mileena.jpg'
        // Player properties
        const playerWidth = 40, playerHeight = 80, ground = 300;
        const speed = 4, jumpPower = 12, gravity = 0.7, attackRange = 50, attackCooldown = 500, maxHealth = 15;

        // Player 1 (left)
        const p1 = {
            x: 100, y: ground, vx: 0, vy: 0, color: "#4af", health: maxHealth, onGround: true, facing: 1,
            attacking: false, lastAttack: 0, blocking: false,
            specialAttacking: false, lastSpecial: 0, nextKick: false
        };
        // Player 2 (right)
        const p2 = {
            x: 660, y: ground, vx: 0, vy: 0, color: "#fa4", health: maxHealth, onGround: true, facing: -1,
            attacking: false, lastAttack: 0, blocking: false,
            specialKicking: false, lastSpecialKick: 0, nextKick: false
        };

        // Add this near the top, after player definitions:
        const particles = [];
        let staffFlying = false;
        let staffFlyX = 0, staffFlyY = 0, staffFlyVX = 0, staffFlyVY = 0, staffFlyTargetX = 0, staffFlyTargetY = 0, staffFlyTimer = 0;

        // Controls
        const keys = {};
        document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function drawPlayer(p) {
            // Walking animation variables
            let walkCycle = 0;
            if (!p.walkCycle) p.walkCycle = 0;
            if (Math.abs(p.vx) > 0.1 && p.onGround) {
                p.walkCycle += 0.2;
            } else {
                p.walkCycle = 0;
            }
            walkCycle = p.walkCycle;

            // Leg length adjustment: shorter when jumping or during Player 1's special move
            let isShortLegs = !p.onGround || (p === p1 && p.specialAttacking);
            let legLength = isShortLegs ? 24 : 40;
            let kneeOffset = isShortLegs ? 10 : 18;
            let footOffset = isShortLegs ? 10 : 22;

            // Shirt and pants color
            const outfitColor = (p === p1) ? "#2196f3" : "#888"; // Player 1: blue, Player 2: grey

            // Draw legs with improved walking animation (legs swing forward/back)
            ctx.strokeStyle = "#111"; // Legs always black
            ctx.lineWidth = 6;
            ctx.beginPath();

            let hipX = p.x + playerWidth / 2;
            let hipY = p.y + playerHeight - 10;

            // Left leg (swings forward/back)
            let leftLegSwing = Math.sin(walkCycle) * 18;
            let leftKneeX = hipX - 8 + Math.sin(walkCycle) * 6;
            let leftKneeY = hipY + kneeOffset - Math.abs(leftLegSwing) * 0.2;
            let leftFootX = leftKneeX + Math.sin(walkCycle) * 8;
            let leftFootY = leftKneeY + footOffset + Math.max(0, -leftLegSwing * 0.15);

            // Right leg (swings opposite phase)
            let rightLegSwing = -Math.sin(walkCycle) * 18;
            let rightKneeX = hipX + 8 + Math.sin(walkCycle + Math.PI) * 6;
            let rightKneeY = hipY + kneeOffset - Math.abs(rightLegSwing) * 0.2;
            let rightFootX = rightKneeX + Math.sin(walkCycle + Math.PI) * 8;
            let rightFootY = rightKneeY + footOffset + Math.max(0, -rightLegSwing * 0.15);

            // Only draw the non-kicking leg if kicking
            if (!(p.isKicking && p.facing === 1)) {
                ctx.moveTo(hipX - 8, hipY);
                ctx.lineTo(leftKneeX, leftKneeY);
                ctx.lineTo(leftFootX, leftFootY);
            }
            if (!(p.isKicking && p.facing === -1)) {
                ctx.moveTo(hipX + 8, hipY);
                ctx.lineTo(rightKneeX, rightKneeY);
                ctx.lineTo(rightFootX, rightFootY);
            }
            ctx.stroke();

            // Draw body (shirt)
            ctx.fillStyle = outfitColor;
            ctx.fillRect(p.x + playerWidth * 0.25, p.y + 30, playerWidth * 0.5, 40);

            // Draw head
            ctx.beginPath();
            ctx.arc(p.x + playerWidth / 2, p.y + 20, 16, 0, Math.PI * 2);
            ctx.fillStyle = "#ffe0b2";
            ctx.fill();

            // Draw arms (with punch animation and walking)
            ctx.strokeStyle = "#ffe0b2";
            ctx.lineWidth = 6;
            ctx.beginPath();

            // Left arm (static unless walking)
            let armSwing = Math.sin(walkCycle) * 8;
            ctx.moveTo(p.x + playerWidth * 0.25, p.y + 40);
            ctx.lineTo(p.x + playerWidth * 0.05, p.y + 60 + armSwing);

            // Right arm (punches when attacking if facing right, else left arm punches)
            if (p.attacking && !p.isKicking) {
                if (p.facing === 1) {
                    // Right punch (extends forward)
                    ctx.moveTo(p.x + playerWidth * 0.75, p.y + 40);
                    ctx.lineTo(p.x + playerWidth * 1.15, p.y + 35);
                } else {
                    // Left punch (extends forward)
                    ctx.moveTo(p.x + playerWidth * 0.25, p.y + 40);
                    ctx.lineTo(p.x - playerWidth * 0.15, p.y + 35);
                }
            } else {
                // Normal right arm with walking swing
                let armSwing2 = -Math.sin(walkCycle) * 8;
                ctx.moveTo(p.x + playerWidth * 0.75, p.y + 40);
                ctx.lineTo(p.x + playerWidth * 0.95, p.y + 60 + armSwing2);
            }
            ctx.stroke();

            // Draw kick animation if isKicking
            if (p.isKicking) {
                ctx.strokeStyle = "#111"; // Kicking leg is black
                ctx.lineWidth = 8;
                ctx.beginPath();
                // The kicking leg is fully lifted and extended forward, not touching the ground
                let kickLength = 48;
                let kickAngle = p.facing === 1 ? -Math.PI / 6 : -5 * Math.PI / 6; // Up and forward
                let kneeX = hipX + Math.cos(kickAngle) * (kickLength * 0.5);
                let kneeY = hipY + Math.sin(kickAngle) * (kickLength * 0.5);
                let footX = hipX + Math.cos(kickAngle) * kickLength;
                let footY = hipY + Math.sin(kickAngle) * kickLength;

                // Draw the lifted kicking leg (on the correct side)
                ctx.moveTo(hipX + 8 * p.facing, hipY);
                ctx.lineTo(kneeX, kneeY);
                ctx.lineTo(footX, footY);
                ctx.stroke();
            }

            // Draw block outline
            if (p.blocking) {
                ctx.save();
                ctx.strokeStyle = "#0f0";
                ctx.lineWidth = 4;
                ctx.strokeRect(p.x - 4, p.y - 4, playerWidth + 8, playerHeight + 8);
                ctx.restore();
            }

            // Always show golden staff in Player 2's hand (acts like dagger)
            if (p === p2) {
                // Right hand (matches punch animation if attacking, otherwise follows arm swing)
                let staffX, staffY, staffDir;
                if (p.attacking && !p.isKicking) {
                    if (p.facing === 1) {
                        staffX = p.x + playerWidth * 1.15;
                        staffY = p.y + 35;
                        staffDir = 1;
                    } else {
                        staffX = p.x - playerWidth * 0.15;
                        staffY = p.y + 35;
                        staffDir = -1;
                    }
                } else {
                    // Normal right hand position
                    let armSwing2 = -Math.sin(walkCycle) * 8;
                    staffX = p.x + playerWidth * 0.95;
                    staffY = p.y + 60 + armSwing2;
                    staffDir = p.facing === -1 ? -1 : 1;
                }
                let staffEndX = staffX;
                let staffEndY = staffY;
                if (p.attacking) {
                    staffEndX += 35;
                } else {
                    staffEndY += 35;
                }

                ctx.save();
                // Staff (long, golden, aligned with hand)
                ctx.strokeStyle = "#FFD700"; // Gold color
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.moveTo(staffX, staffY);
                ctx.lineTo(staffEndX + 0 * staffDir, staffEndY); // Long staff, straight down from hand
                ctx.stroke();

                // Staff tip (rounded)
                ctx.beginPath();
                ctx.arc(staffEndX + 0 * staffDir, staffEndY, 7, 0, Math.PI * 2);
                ctx.fillStyle = "#FFD700";
                ctx.fill();

                // Staff end (rounded at hand)
                ctx.beginPath();
                ctx.arc(staffX, staffY, 6, 0, Math.PI * 2);
                ctx.fillStyle = "#FFD700";
                ctx.fill();

                ctx.restore();
            }
        }

        function drawHealth(p, x, y) {
            for (let i = 0; i < Math.floor(p.health); i++) {
                ctx.fillStyle = "#e33";
                ctx.fillRect(x + i * 22, y, 20, 20);
            }
            // Draw half-heart if needed
            if (p.health % 1 >= 0.5) {
                ctx.fillStyle = "#e33";
                ctx.globalAlpha = 0.5;
                ctx.fillRect(x + Math.floor(p.health) * 22, y, 20, 20);
                ctx.globalAlpha = 1.0;
            }
        }

        function updatePlayer(p, left, right, jump, attackKey, blockKey, now, specialKey, specialKickKey) {
            // Movement
            if (keys[left]) { p.vx = -speed; p.facing = -1; }
            else if (keys[right]) { p.vx = speed; p.facing = 1; }
            else p.vx = 0;

            // Jump
            if (keys[jump] && p.onGround) {
                p.vy = -jumpPower;
                p.onGround = false;
            }

            // Block
            p.blocking = !!keys[blockKey];

            // Special attack (Player 1 only)
            if (specialKey && keys[specialKey] && !p.specialAttacking && now - p.lastSpecial > 6000 && p.onGround) {
                p.specialAttacking = true;
                p.attacking = true;
                p.lastSpecial = now;
                // Jump toward the other player
                p.vy = -jumpPower * 0.9;
                p.vx = (p === p1 ? (p2.x > p1.x ? 1 : -1) : 0) * (speed * 2.2);
                setTimeout(() => {
                    p.specialAttacking = false;
                    p.attacking = false;
                }, 350);
            }

            // Special kick (Player 2 only)
            if (specialKickKey && keys[specialKickKey] && !p.specialKicking && now - p.lastSpecialKick > 6000 && p.onGround) {
                // If far away, throw staff
                const dist = Math.abs(p1.x - p2.x);
                if (dist > 120) {
                    p.specialKicking = true;
                    p.attacking = false;
                    p.lastSpecialKick = now;
                    staffFlying = true;
                    staffFlyX = p2.x + playerWidth / 2;
                    staffFlyY = p2.y + 40;
                    staffFlyTargetX = p1.x + playerWidth / 2;
                    staffFlyTargetY = p1.y + 20;
                    const dx = staffFlyTargetX - staffFlyX;
                    const dy = staffFlyTargetY - staffFlyY;
                    const len = Math.sqrt(dx * dx + dy * dy);
                    staffFlyVX = dx / (len / 12);
                    staffFlyVY = dy / (len / 12);
                    staffFlyTimer = 0;
                    setTimeout(() => {
                        p.specialKicking = false;
                    }, 700);
                } else {
                    // Normal close-range special kick
                    p.specialKicking = true;
                    p.attacking = true;
                    p.lastSpecialKick = now;
                    p.vy = -jumpPower * 0.5;
                    setTimeout(() => {
                        p.specialKicking = false;
                        p.attacking = false;
                    }, 350);
                }
            }

            // Normal attack
            if (keys[attackKey] && !p.attacking && now - p.lastAttack > attackCooldown && !p.specialAttacking && !p.specialKicking) {
                if (!p.nextKick) {
                    // This is a punch, so set up next attack as a kick
                    p.attacking = true;
                    p.lastAttack = now;
                    p.isKicking = false;
                    setTimeout(() => { p.attacking = false; }, 150);
                    p.nextKick = true;
                } else {
                    // This is a kick
                    p.attacking = true;
                    p.lastAttack = now;
                    p.isKicking = true;
                    setTimeout(() => { p.attacking = false; p.isKicking = false; }, 200);
                    p.nextKick = false;
                }
            }

            // Apply physics
            p.x += p.vx;
            p.y += p.vy;
            p.vy += gravity;

            // Ground collision
            if (p.y >= ground) {
                p.y = ground;
                p.vy = 0;
                p.onGround = true;
                // Stop special attack/kick movement on landing
                if (p.specialAttacking) {
                    p.specialAttacking = false;
                    p.attacking = false;
                }
                if (p.specialKicking) {
                    p.specialKicking = false;
                    p.attacking = false;
                }
            }

            // Wall collision
            p.x = Math.max(0, Math.min(canvas.width - playerWidth, p.x));
        }

        // Update loop to pass specialKey for p1 ('e' for example, you can change it)
        function loop() {
            const now = Date.now();
            if (p1.health <= 0) {
                draw();
                gameOver("Player 2");
                return;
            }
            if (p2.health <= 0) {
                draw();
                gameOver("Player 1");
                return;
            }
            updatePlayer(p1, 'a', 'd', 'w', 'f', 'q', now, 'z'); // 'z' triggers special attack for p1
            updatePlayer(p2, 'arrowleft', 'arrowright', 'arrowup', '/', 'arrowdown', now, null, 'k'); // 'k' triggers special kick for p2
            checkAttack(p1, p2);
            checkAttack(p2, p1);
            updateParticles();
            draw();
            requestAnimationFrame(loop);
        }

        // Modify checkAttack to make Player 2's punch use dagger hitbox and do more damage:

        function checkAttack(attacker, defender) {
            if (!attacker.attacking) return;
            // Attack hitbox
            let ax, ay, aw, ah;
            if (attacker.specialKicking) {
                // Special staff attack hitbox (neck area)
                ax = defender.x + playerWidth / 2 - 10;
                ay = defender.y + 10;
                aw = 20;
                ah = 20;
            } else if (attacker.isKicking) {
                ax = attacker.facing === 1 ? attacker.x + playerWidth : attacker.x - 30;
                ay = attacker.y + 40;
                aw = 30;
                ah = 30;
            } else if (attacker === p2) {
                // Regular staff attack hitbox
                ax = attacker.facing === 1 ? attacker.x + playerWidth + 10 : attacker.x - 30;
                ay = attacker.y + 35;
                aw = 34;
                ah = 18;
            } else {
                ax = attacker.facing === 1 ? attacker.x + playerWidth : attacker.x - 20;
                ay = attacker.y + 20;
                aw = 20;
                ah = 20;
            }
            // Defender hitbox
            let dx = defender.x, dy = defender.y, dw = playerWidth, dh = playerHeight;
            if (
                ax < dx + dw && ax + aw > dx &&
                ay < dy + dh && ay + ah > dy
            ) {
                let damage = attacker.isKicking ? 2 : 1;
                if (attacker.specialKicking) damage = 6; // Special staff attack does 6 damage
                else if (attacker === p2 && !attacker.isKicking) damage = 1; // Regular staff attack does 1 damage
                if (attacker.specialAttacking) damage = 5;
                if (defender.blocking) {
                    defender.health -= damage / 2;
                } else {
                    defender.health -= damage;
                }
                attacker.attacking = false;
                attacker.specialAttacking = false;
                attacker.specialKicking = false;

                // Spawn red glitter at defender's neck for special, else normal
                let hitY = attacker.specialKicking ? defender.y + 18 : (attacker.isKicking ? defender.y + 75 : defender.y + 50);
                spawnParticles(defender.x + playerWidth / 2, hitY);
            }

            if (staffFlying && Math.abs(staffFlyX - (defender.x + playerWidth / 2)) < 24 && Math.abs(staffFlyY - (defender.y + 20)) < 24) {
                let damage = 5; // Staff flying hit does 5 damage
                if (defender.blocking) {
                    defender.health -= damage / 2;
                } else {
                    defender.health -= damage;
                }
                staffFlying = false;
                spawnParticles(defender.x + playerWidth / 2, defender.y + 18);
            }
        }

        // Particle effect for damage (red glitter)
        function spawnParticles(x, y) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: -Math.random() * 3,
                    alpha: 1,
                    life: 20 + Math.random() * 10
                });
            }
        }

        function drawParticles() {
            for (let p of particles) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = "#f44";
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15;
                p.alpha -= 0.04;
                p.life--;
                if (p.life <= 0 || p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            if (staffFlying) {
                staffFlyX += staffFlyVX;
                staffFlyY += staffFlyVY;
                staffFlyTimer++;
                // Remove staff after 40 frames if it misses
                if (staffFlyTimer > 40) staffFlying = false;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Draw ground
            ctx.drawImage(background, 0, 0, canvas.width, canvas.height);

            // ctx.fillStyle = "#222";
            // ctx.fillRect(0, ground + playerHeight, canvas.width, canvas.height - ground - playerHeight);
            // Draw players
            drawPlayer(p1);
            drawPlayer(p2);
            // Draw health
            drawHealth(p1, 20, 20);
            drawHealth(p2, canvas.width - 20 - maxHealth * 22, 20);
            // Draw particles
            drawParticles();

            if (staffFlying) {
                ctx.save();
                ctx.strokeStyle = "#FFD700";
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.moveTo(staffFlyX, staffFlyY);
                ctx.lineTo(staffFlyX, staffFlyY + 48);
                ctx.stroke();
                // Staff tip
                ctx.beginPath();
                ctx.arc(staffFlyX, staffFlyY + 48, 7, 0, Math.PI * 2);
                ctx.fillStyle = "#FFD700";
                ctx.fill();
                // Staff end
                ctx.beginPath();
                ctx.arc(staffFlyX, staffFlyY, 6, 0, Math.PI * 2);
                ctx.fillStyle = "#FFD700";
                ctx.fill();
                ctx.restore();
            }
        }

        function gameOver(winner) {
            ctx.fillStyle = "#fff";
            ctx.font = "48px Arial";
            ctx.fillText(`${winner} Wins!`, canvas.width / 2 - 120, canvas.height / 2);
        }

        loop();
    </script>
</body>

</html>
