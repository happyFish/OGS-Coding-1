<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Ragdoll Game</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; }
        canvas { display: block; }
    </style>
    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.153.0/build/three.min.js"></script>
    <!-- Cannon.js -->
    <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
</head>
<body>
<script>
// --- Three.js Setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 18);
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
// Lighting
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(10, 20, 10);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.3));
// --- Cannon.js Physics World ---
const world = new CANNON.World();
world.gravity.set(0, -9.82, 0);
world.broadphase = new CANNON.NaiveBroadphase();
world.solver.iterations = 10;
// Ground
const groundMat = new CANNON.Material();
const groundBody = new CANNON.Body({ mass: 0, material: groundMat });
groundBody.addShape(new CANNON.Plane());
groundBody.quaternion.setFromEuler(-Math.PI/2, 0, 0); // Rotate to match Three.js ground
world.addBody(groundBody);
const groundGeo = new THREE.PlaneGeometry(80, 80); // Match groundSize
const groundMesh = new THREE.Mesh(groundGeo, new THREE.MeshPhongMaterial({color:0x00ff00, side:THREE.DoubleSide})); // green
groundMesh.rotation.x = -Math.PI/2;
scene.add(groundMesh);
// --- Ragdoll Parts (Multiple Ragdolls Support) ---
function createRagdoll(origin) {
    const parts = [];
    const meshes = [];
    function createPart(shape, size, pos, mass, color) {
        let body, mesh;
        if (shape === 'sphere') {
            body = new CANNON.Body({ mass });
            body.addShape(new CANNON.Sphere(size));
            mesh = new THREE.Mesh(
                new THREE.SphereGeometry(size, 32, 32),
                new THREE.MeshPhongMaterial({color})
            );
        } else if (shape === 'box') {
            body = new CANNON.Body({ mass });
            body.addShape(new CANNON.Box(new CANNON.Vec3(size[0], size[1], size[2])));
            mesh = new THREE.Mesh(
                new THREE.BoxGeometry(size[0]*2, size[1]*2, size[2]*2),
                new THREE.MeshPhongMaterial({color})
            );
        } else if (shape === 'cylinder') {
            body = new CANNON.Body({ mass });
            body.addShape(new CANNON.Cylinder(size[0], size[0], size[1], 32));
            mesh = new THREE.Mesh(
                new THREE.CylinderGeometry(size[0], size[0], size[1], 32),
                new THREE.MeshPhongMaterial({color})
            );
        }
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.geometry.computeBoundingBox();
        mesh.geometry.computeBoundingSphere();
        body.position.set(origin[0]+pos[0], origin[1]+pos[1], origin[2]+pos[2]);
        world.addBody(body);
        scene.add(mesh);
        parts.push(body);
        meshes.push(mesh);
        return body;
    }
    // Torso
    const torso = createPart('box', [0.5, 1.2, 0.3], [0, 0, 0], 3, 0x00bfff);
    // Head
    const head = createPart('sphere', 0.4, [0, 1.8, 0], 1, 0xffe066);
    // Upper arms
    const leftUpperArm = createPart('cylinder', [0.18, 0.8], [-0.8, 1.2, 0], 0.5, 0xffff00); // yellow
    const rightUpperArm = createPart('cylinder', [0.18, 0.8], [0.8, 1.2, 0], 0.5, 0xffff00); // yellow
    // Lower arms
    const leftLowerArm = createPart('cylinder', [0.15, 0.7], [-1.3, 0.5, 0], 0.4, 0xffff00); // yellow
    const rightLowerArm = createPart('cylinder', [0.15, 0.7], [1.3, 0.5, 0], 0.4, 0xffff00); // yellow
    // Upper legs
    const leftUpperLeg = createPart('cylinder', [0.22, 1.0], [-0.35, -1.7, 0], 1, 0x66ff66);
    const rightUpperLeg = createPart('cylinder', [0.22, 1.0], [0.35, -1.7, 0], 1, 0x66ff66);
    // Lower legs
    const leftLowerLeg = createPart('cylinder', [0.18, 0.9], [-0.35, -3.3, 0], 0.7, 0xaaffaa);
    const rightLowerLeg = createPart('cylinder', [0.18, 0.9], [0.35, -3.3, 0], 0.7, 0xaaffaa);
    // --- Constraints (Joints) ---
    function addJoint(a, b, opts) {
        const c = new CANNON.ConeTwistConstraint(a, b, opts);
        world.addConstraint(c);
    }
    addJoint(torso, head, { pivotA: new CANNON.Vec3(0,1.3,0), pivotB: new CANNON.Vec3(0,-0.4,0) });
    addJoint(torso, leftUpperArm, { pivotA: new CANNON.Vec3(-0.5,0.9,0), pivotB: new CANNON.Vec3(0,0.4,0) });
    addJoint(torso, rightUpperArm, { pivotA: new CANNON.Vec3(0.5,0.9,0), pivotB: new CANNON.Vec3(0,0.4,0) });
    addJoint(leftUpperArm, leftLowerArm, { pivotA: new CANNON.Vec3(0,-0.4,0), pivotB: new CANNON.Vec3(0,0.35,0) });
    addJoint(rightUpperArm, rightLowerArm, { pivotA: new CANNON.Vec3(0,-0.4,0), pivotB: new CANNON.Vec3(0,0.35,0) });
    addJoint(torso, leftUpperLeg, { pivotA: new CANNON.Vec3(-0.25,-1.2,0), pivotB: new CANNON.Vec3(0,0.5,0) });
    addJoint(torso, rightUpperLeg, { pivotA: new CANNON.Vec3(0.25,-1.2,0), pivotB: new CANNON.Vec3(0,0.5,0) });
    addJoint(leftUpperLeg, leftLowerLeg, { pivotA: new CANNON.Vec3(0,-0.5,0), pivotB: new CANNON.Vec3(0,0.45,0) });
    addJoint(rightUpperLeg, rightLowerLeg, { pivotA: new CANNON.Vec3(0,-0.5,0), pivotB: new CANNON.Vec3(0,0.45,0) });
    return {
        parts,
        meshes,
        torso
    };
}

// Create 10 ragdolls spaced out in the arena
const ragdollOrigins = [
    [0, 7, 0],
    [3, 7, 3],
    [-3, 7, -3],
    [3, 7, -3],
    [-3, 7, 3],
    [6, 7, 0],
    [-6, 7, 0],
    [0, 7, 6],
    [0, 7, -6],
    [6, 7, 6]
];
const ragdolls = ragdollOrigins.map(origin => createRagdoll(origin));

// For mouse grabbing/flinging, we use the first ragdoll's parts/meshes for hit detection
let selectedPart = null, mouseConstraint = null, mouseBody = new CANNON.Body({ mass: 0 }), lastMousePos = new THREE.Vector2(), lastMouseTime = 0, mouseVel = new THREE.Vector3();
world.addBody(mouseBody);
let isGrabbing = false;

function getMouseIntersection(e) {
    const rect = renderer.domElement.getBoundingClientRect();
    const mouse = new THREE.Vector2(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
    );
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(mouse, camera);
    // Check all ragdoll meshes for intersection
    let allMeshes = ragdolls.flatMap(r => r.meshes);
    const intersects = raycaster.intersectObjects(allMeshes);
    if (intersects.length > 0) {
        return intersects[0];
    }
    return null;
}

// --- Add a Movable Box in the Arena ---
const boxSize = 1;
const boxBody = new CANNON.Body({ mass: 5 });
boxBody.addShape(new CANNON.Box(new CANNON.Vec3(boxSize/2, boxSize/2, boxSize/2)));
boxBody.position.set(0, 8, -5);
world.addBody(boxBody);
const boxMesh = new THREE.Mesh(
    new THREE.BoxGeometry(boxSize, boxSize, boxSize),
    new THREE.MeshPhongMaterial({color: 0xff8800})
);
scene.add(boxMesh);

// Update box mesh position/quaternion in syncMeshes
const oldSyncMeshes = syncMeshes;
syncMeshes = function() {
    oldSyncMeshes();
    boxMesh.position.copy(boxBody.position);
    boxMesh.quaternion.copy(boxBody.quaternion);
};

function syncMeshes() {
    for (const ragdoll of ragdolls) {
        for (let i = 0; i < ragdoll.parts.length; i++) {
            ragdoll.meshes[i].position.copy(ragdoll.parts[i].position);
            ragdoll.meshes[i].quaternion.copy(ragdoll.parts[i].quaternion);
        }
    }
}

renderer.domElement.addEventListener('mousedown', function(e) {
    syncMeshes();
    const hit = getMouseIntersection(e);
    if (hit) {
        // Find which ragdoll and part was hit
        let meshIdx = -1, ragdollIdx = -1;
        for (let r = 0; r < ragdolls.length; r++) {
            meshIdx = ragdolls[r].meshes.indexOf(hit.object);
            if (meshIdx !== -1) {
                ragdollIdx = r;
                break;
            }
        }
        if (ragdollIdx !== -1) {
            selectedPart = ragdolls[ragdollIdx].parts[meshIdx];
            mouseBody.position.copy(hit.point);
            mouseConstraint = new CANNON.PointToPointConstraint(
                selectedPart, new CANNON.Vec3().copy(selectedPart.pointToLocalFrame(hit.point)),
                mouseBody, new CANNON.Vec3(0,0,0)
            );
            world.addConstraint(mouseConstraint);
            lastMousePos = new THREE.Vector2(e.clientX, e.clientY);
            lastMouseTime = performance.now();
            mouseVel.set(0,0,0);
            isGrabbing = true;
        }
    }
});

renderer.domElement.addEventListener('mousemove', function(e) {
    syncMeshes();
    if (!mouseConstraint || !isGrabbing) return;
    const rect = renderer.domElement.getBoundingClientRect();
    const mouse = new THREE.Vector2(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
    );
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(mouse, camera);
    const plane = new THREE.Plane(new THREE.Vector3(0,0,1).applyQuaternion(camera.quaternion), -selectedPart.position.dot(new THREE.Vector3(0,0,1).applyQuaternion(camera.quaternion)));
    const intersection = new THREE.Vector3();
    raycaster.ray.intersectPlane(plane, intersection);
    mouseBody.position.copy(intersection);
    let now = performance.now();
    let dt = (now - lastMouseTime) / 1000;
    if (dt > 0) {
        let dx = e.clientX - lastMousePos.x;
        let dy = e.clientY - lastMousePos.y;
        mouseVel.set(dx/dt, dy/dt, 0);
        lastMousePos.set(e.clientX, e.clientY);
        lastMouseTime = now;
    }
});

renderer.domElement.addEventListener('mouseup', function(e) {
    if (mouseConstraint && selectedPart) {
        const rect = renderer.domElement.getBoundingClientRect();
        const ndcVel = new THREE.Vector2(
            (mouseVel.x / rect.width) * 2,
            (-mouseVel.y / rect.height) * 2
        );
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
        let forward = raycaster.ray.direction.clone();
        let right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
        let up = camera.up.clone().normalize();
        let worldVel = new THREE.Vector3();
        worldVel.addScaledVector(right, ndcVel.x * 10);
        worldVel.addScaledVector(up, ndcVel.y * 10);
        worldVel.addScaledVector(forward, 5);
        selectedPart.applyImpulse(
            new CANNON.Vec3(worldVel.x, worldVel.y, worldVel.z),
            selectedPart.position
        );
    }
    if (mouseConstraint) {
        world.removeConstraint(mouseConstraint);
        mouseConstraint = null;
        selectedPart = null;
        isGrabbing = false;
    }
});

// --- WASD Ragdoll Movement (All Ragdolls) ---
const ragdollForce = 40;
document.addEventListener('keydown', e => {
    if (e.repeat) return;
    // WASD ragdoll movement
    if (e.key === 'w' || e.key === 'W') {
        ragdolls.forEach(r => r.torso.applyImpulse(new CANNON.Vec3(0, 0, -ragdollForce), r.torso.position));
    } else if (e.key === 's' || e.key === 'S') {
        ragdolls.forEach(r => r.torso.applyImpulse(new CANNON.Vec3(0, 0, ragdollForce), r.torso.position));
    } else if (e.key === 'a' || e.key === 'A') {
        ragdolls.forEach(r => r.torso.applyImpulse(new CANNON.Vec3(-ragdollForce, 0, 0), r.torso.position));
    } else if (e.key === 'd' || e.key === 'D') {
        ragdolls.forEach(r => r.torso.applyImpulse(new CANNON.Vec3(ragdollForce, 0, 0), r.torso.position));
    }
    // Spacebar jump
    else if (e.code === 'Space') {
        ragdolls.forEach(r => r.torso.applyImpulse(new CANNON.Vec3(0, 80, 0), r.torso.position));
    }
    // Arrow key camera movement
    if (e.key === 'ArrowUp') camMove.up = true;
    if (e.key === 'ArrowDown') camMove.down = true;
    if (e.key === 'ArrowLeft') camMove.left = true;
    if (e.key === 'ArrowRight') camMove.right = true;
    // E/Q for camera up/down
    if (e.key === 'e' || e.key === 'E') camMove.upY = true;
    if (e.key === 'q' || e.key === 'Q') camMove.downY = true;
});
document.addEventListener('keyup', e => {
    if (e.key === 'ArrowUp') camMove.up = false;
    if (e.key === 'ArrowDown') camMove.down = false;
    if (e.key === 'ArrowLeft') camMove.left = false;
    if (e.key === 'ArrowRight') camMove.right = false;
    if (e.key === 'e' || e.key === 'E') camMove.upY = false;
    if (e.key === 'q' || e.key === 'Q') camMove.downY = false;
});

function updateCameraArrows() {
    let forward = new THREE.Vector3();
    camera.getWorldDirection(forward);
    forward.y = 0;
    forward.normalize();
    let right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();
    let move = new THREE.Vector3();
    if (camMove.up) move.add(forward);
    if (camMove.down) move.sub(forward);
    if (camMove.left) move.sub(right);
    if (camMove.right) move.add(right);
    if (camMove.upY) move.y += 1;
    if (camMove.downY) move.y -= 1;
    if (move.lengthSq() > 0) {
        move.normalize().multiplyScalar(camSpeed);
        camera.position.add(move);
        camTarget.add(move);
    }
    camera.lookAt(camTarget);
}

// --- Animation Loop (All Ragdolls) ---
function animate() {
    world.step(1/60);
    syncMeshes();
    updateCameraArrows();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}
// --- Arrow Key Camera Movement ---
let camTarget = new THREE.Vector3(0, 7, 0);
let camMove = { up: false, down: false, left: false, right: false, upY: false, downY: false };
let camSpeed = 0.3;
// --- Barriers (Walls) ---
const wallThickness = 1;
const wallHeight = 40; // Increased height
const groundSize = 80; // Increased size
const wallMaterial = new THREE.MeshPhongMaterial({color: 0x00ffff}); // cyan

function addWall(x, y, z, sx, sy, sz) {
    // Cannon.js
    const shape = new CANNON.Box(new CANNON.Vec3(sx/2, sy/2, sz/2));
    const body = new CANNON.Body({ mass: 0 });
    body.addShape(shape);
    body.position.set(x, y, z);
    world.addBody(body);
    // Three.js
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(sx, sy, sz),
        wallMaterial
    );
    mesh.position.set(x, y, z);
    scene.add(mesh);
}
// Left wall
addWall(-groundSize/2, wallHeight/2, 0, wallThickness, wallHeight, groundSize);
// Right wall
addWall(groundSize/2, wallHeight/2, 0, wallThickness, wallHeight, groundSize);
// Back wall
addWall(0, wallHeight/2, -groundSize/2, groundSize, wallHeight, wallThickness);
// Front wall
addWall(0, wallHeight/2, groundSize/2, groundSize, wallHeight, wallThickness);
// Roof barrier (cyan)
addWall(0, wallHeight + wallThickness/2, 0, groundSize, wallThickness, groundSize);

// --- Add a Blender (Cylinder with Rotating Blades) ---
// Blender parameters
const blenderRadius = 6;
const blenderHeight = 10;
const blenderY = blenderHeight/2; // Sits on ground
// --- Blender wall, physics, and blades removed ---

animate();
</script>
</body>
</html>
